# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: teslha
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    # next start binds to $PORT, which Render provides.
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
